<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e0607e">
<title>仮想SNS 模擬運用</title>
<style>
:root{--bg:#fff;--fg:#101010;--sub:#777;--line:#e6e6e6;--card:#fff;--accent:#e0607e;--chip:#f3f3f3;--ok:#2e8b57;--warn:#c98a00;--stop:#8a8a8a}
@media (prefers-color-scheme:dark){:root{--bg:#101010;--fg:#f3f3f3;--sub:#9a9a9a;--line:#2a2a2a;--card:#161616;--chip:#222}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 80px}
.banner{background:var(--chip);color:var(--sub);font-size:12px;text-align:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.profile{padding:20px 0 12px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:14px;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#f6c1cf,#e0607e);display:grid;place-items:center;color:#fff;font-size:26px;flex:none}
.name{font-weight:700;font-size:17px}.handle{color:var(--sub);font-size:13px}
.bio{margin:12px 0 0;white-space:pre-wrap}
.clock{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.clock b{font-size:14px}
.clock input[type=range]{width:100%;accent-color:var(--accent)}
.clock .btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:8px}
.tab{flex:1;text-align:center;padding:12px 0;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-color:var(--fg);font-weight:600}
.tabs{overflow-x:auto}
.tab{flex:1 0 auto;padding:12px 14px;white-space:nowrap}
.ops .item{border-top:1px solid var(--line);padding:12px 0}
.ops h3{font-size:14px;margin:18px 0 4px}
.ops .t{white-space:pre-wrap;margin:4px 0}
.ops textarea,.ops input{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-top:6px}
.ops .nums{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ops .nums input{padding:6px 4px;text-align:center}
.post{padding:16px 0;border-bottom:1px solid var(--line)}
.meta{display:flex;gap:8px;align-items:center;color:var(--sub);font-size:12px;flex-wrap:wrap}
.text{white-space:pre-wrap;margin:6px 0 8px;word-break:break-word}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:11px}
.s-approved{color:var(--ok)}.s-queued{color:var(--accent)}.s-review{color:var(--warn)}.s-hold,.s-waiting,.s-reserve{color:var(--stop)}
.note{font-size:12px;color:var(--sub)}
.empty{color:var(--sub);padding:40px 0;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--chip);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--sub)}
.stat b{display:block;font-size:20px;color:var(--fg)}

.form{padding:16px 0}
.form label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px}
.form textarea,.form input[type=text],.form select{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.form textarea{resize:vertical;min-height:140px}
.form .inline{display:flex;gap:12px;flex-wrap:wrap}
.form .inline label{display:flex;align-items:center;gap:4px;margin:0;color:var(--fg);font-size:14px}
.counter{font-size:12px;color:var(--sub);text-align:right}.counter.over{color:#d33;font-weight:700}
.warn{font-size:12px;color:var(--warn);margin:6px 0;white-space:pre-wrap}
.privacy{font-size:12px;color:var(--sub);background:var(--chip);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.saved .item{border-top:1px solid var(--line);padding:12px 0}
.saved .item .t{white-space:pre-wrap;margin:4px 0}
.sm{font-size:12px;padding:3px 10px}
.switch{display:flex;gap:8px;padding:10px 0 0}
.switch button{flex:1;border-radius:12px;padding:8px 6px;font-size:13px}
.switch button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="banner">シミュレーションです。実際の投稿ではありません（Threads・Instagram・ROOMには何も送信されません）<br><a href="notify.html" style="color:var(--accent);font-weight:600">通知の設定はこちら</a></div>
<div class="wrap">
  <div class="switch" id="switch"></div>
  <section class="profile">
    <div class="row"><div class="avatar" id="avatar">♡</div>
      <div><div class="name" id="pname">なぎ｜無駄買いしない可愛いもの</div><div class="handle" id="phandle">@m_nagi_note</div></div></div>
    <p class="bio" id="pbio">可愛いものが好き。でも無駄買いはしたくない。
2児のママ｜子ども服・キッズ雑貨・暮らしの便利もの
買ってよかった／買わなくてよかった、どっちも正直に。
※一部PRを含みます
▼ROOMにまとめてます</p>
  </section>

  <section class="clock">
    <b>模擬の現在日時：<span id="now"></span></b>
    <input id="slider" type="range" min="0" max="13" value="0">
    <div class="btns">
      <button class="primary" id="next">次の投稿予定まで進める</button>
      <button id="reset">最初に戻す</button>
      <button id="auto">自動再生</button>
    </div>
  </section>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <div class="tab on" data-tab="timeline">タイムライン</div>
    <div class="tab" data-tab="stopped">止まっている投稿</div>
    <div class="tab" data-tab="draft">下書き</div>
    <div class="tab" data-tab="memo">体験メモ</div>
    <div class="tab" data-tab="review">承認</div>
    <div class="tab" data-tab="plan">予定</div>
    <div class="tab" data-tab="stats">成績</div>
  </div>
  <div id="list"></div>
</div>

<script>
const STATUS = {approved:"承認済み（実）",queued:"検査済・承認待ち（承認された想定で表示）",review:"要確認",hold:"保留",waiting:"体験待ち",reserve:"控え（今期は予定なし）"};
const SHOWN = ["approved","queued"];
const ACCOUNTS = {
  nagi:{label:"なぎ", file:"posts.json", start:"2026-10-12T00:00", pr:true, memo:true,
    avatar:"♡", name:"なぎ｜無駄買いしない可愛いもの", handle:"@m_nagi_note",
    bio:"可愛いものが好き。でも無駄買いはしたくない。\n2児のママ｜子ども服・キッズ雑貨・暮らしの便利もの\n買ってよかった／買わなくてよかった、どっちも正直に。\n※一部PRを含みます\n▼ROOMにまとめてます"},
  kids:{label:"女の子服ニュース（別担当）", file:"posts_kids.json", start:"2026-10-10T00:00", pr:false, memo:false,
    avatar:"☆", name:"プチプラ女の子服ニュース（仮）", handle:"@（未定）",
    bio:"未就学の女の子の服を、税込2,900円以内で。\n新作・コラボを、出典つきで。\n1,000円台なら◎。\n※アフィリエイトなし／PRなし"}
};
let acct = "nagi";
try{ const a=localStorage.getItem("acct"); if(ACCOUNTS[a]) acct=a; }catch(e){}
if(ACCOUNTS[location.hash.slice(1)]) acct=location.hash.slice(1);
let START = new Date(ACCOUNTS[acct].start);
let posts = [], day = 0, tab = "timeline", timer = null;

const $ = s => document.querySelector(s);
const fmt = d => d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"});
function nowDate(){ const d = new Date(START); d.setDate(d.getDate()+day); d.setHours(23,59); return d; }


const lsKey=k=>acct==="nagi"?k:acct+":"+k;
const LS={get(k){try{return JSON.parse(localStorage.getItem(lsKey(k))||"[]")}catch(e){return []}},set(k,v){try{localStorage.setItem(lsKey(k),JSON.stringify(v))}catch(e){}}};
const NG=["絶対","必ず","治る","No.1","最安","誰でも","100%","効果がある"];
function el(tag,props,...kids){const e=document.createElement(tag);Object.assign(e,props||{});kids.forEach(k=>e.append(k));return e;}
function copyText(t,btn){const o=btn.textContent;navigator.clipboard.writeText(t).then(()=>{btn.textContent="コピーしました";setTimeout(()=>btn.textContent=o,1500)}).catch(()=>{window.prompt("コピーしてください",t)})}
function opts(arr){return arr.map(a=>{const o=document.createElement("option");o.textContent=a;return o})}
const CATS=["子ども服・可愛いもの","暮らし","流行・先取り","趣味・雑貨"];
const FORMS=["独り言・共感","質問","買う前チェック","割り切り","気づき","まとめ・ふりかえり","買わない系","ROOM導線","その他"];

function checkDraft(t){
  const w=[];
  if([...t].length>500)w.push("500文字を超えています（Threadsの上限）");
  const ng=NG.filter(x=>t.includes(x)); if(ng.length)w.push("根拠が必要な表現: "+ng.join("、")+"（法務チェック対象）");
  if(ACCOUNTS[acct].pr&&/https?:\/\//.test(t)&&!/^\s*PR/.test(t))w.push("リンクがあります。ROOMリンク・商品を載せる投稿は冒頭に「PR」を入れる決まりです");
  if(/\d{4}年\d{1,2}月\d{1,2}日/.test(t))w.push("生年月日のような表記があります（公開しないルール）");
  if(/保育園|幼稚園/.test(t)&&/(名|園名)/.test(t))w.push("園名が入っていないか確認してください");
  return w;
}

const TOKEN_KEY="ghtoken", ASK_REPO="mizuho-works/nagi-ask";
let flash="";
function getTok(){try{return localStorage.getItem(TOKEN_KEY)||""}catch(e){return ""}}
async function sendIssue(title,body){
  const t=getTok();
  if(!t) throw new Error("先に下の「送信の設定」でトークンを入れてください");
  const r=await fetch("https://api.github.com/repos/"+ASK_REPO+"/issues",{
    method:"POST",
    headers:{"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
    body:JSON.stringify({title,body})
  });
  if(!r.ok) throw new Error([401,403,404].includes(r.status)?"トークンが無効か、権限が足りません（"+r.status+"）":"送信に失敗しました（"+r.status+"）");
}

// ---- 承認・予定・成績（保存先は非公開メモ置き場のIssue） ----
const STATES=["pending","approved","rejected","needs-fix","posted"];
const STATE_JA={pending:"承認待ち",approved:"承認済み（投稿待ち）",rejected:"却下","needs-fix":"修正待ち",posted:"投稿済み"};
async function ghApi(path,opt){
  const t=getTok();
  if(!t) throw new Error("先に「体験メモ」画面の「送信の設定」でトークンを入れてください");
  const o=opt||{};
  const r=await fetch("https://api.github.com/repos/"+ASK_REPO+path,{
    method:o.method||"GET",
    headers:{"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
    body:o.body?JSON.stringify(o.body):undefined
  });
  if(!r.ok) throw new Error([401,403,404].includes(r.status)?"トークンが無効か、権限が足りません（"+r.status+"）":"通信に失敗しました（"+r.status+"）");
  return r.status===204?null:r.json();
}
async function createDraft(d){
  const title="【下書き】"+[...d.text.replace(/\s+/g," ")].slice(0,24).join("");
  await ghApi("/issues",{method:"POST",body:{title,body:JSON.stringify(d),labels:["draft","pending"]}});
}
async function loadDrafts(){
  const a=await ghApi("/issues?labels=draft&state=all&per_page=100&sort=created&direction=desc");
  return a.filter(x=>!x.pull_request).map(x=>{
    let d={}; try{d=JSON.parse(x.body||"{}")}catch(e){}
    const st=x.labels.map(l=>l.name).find(n=>STATES.includes(n))||"pending";
    return {n:x.number,d,state:st,created:x.created_at};
  });
}
async function setState(n,state,comment){
  await ghApi("/issues/"+n+"/labels",{method:"PUT",body:{labels:["draft",state]}});
  if(comment) await ghApi("/issues/"+n+"/comments",{method:"POST",body:{body:comment}});
}
async function patchBody(it,patch){
  await ghApi("/issues/"+it.n,{method:"PATCH",body:{body:JSON.stringify(Object.assign({},it.d,patch))}});
}
const fmtS=s=>{ if(!s) return ""; const d=new Date(s); return isNaN(d)?s:d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"}); };
const nowLocal=()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
function head(it){ return el("div",{className:"note"},"#"+it.n+"｜"+(it.d.cat||"")+"｜"+(it.d.fm||"")+"｜"+STATE_JA[it.state]+(it.d.sched?"｜予定 "+fmtS(it.d.sched):"")); }
function section(wrap,title,items,build){
  wrap.append(el("h3",{},title+"（"+items.length+"）"));
  if(!items.length){ wrap.append(el("div",{className:"note"},"なし")); return; }
  items.forEach(it=>wrap.append(el("div",{className:"item"},head(it),el("div",{className:"t"},it.d.text||""),...build(it))));
}
async function renderOps(){
  const t0=tab;
  const list=$("#list"); list.replaceChildren();
  const wrap=el("div",{className:"form ops"}); list.append(wrap);
  if(!getTok()){ wrap.append(el("div",{className:"privacy"},"先に「体験メモ」画面の「送信の設定」でトークンを入れてください。")); return; }
  wrap.append(el("div",{className:"note"},"読み込み中…"));
  let items;
  try{ items=await loadDrafts(); }catch(e){ if(tab===t0) wrap.replaceChildren(el("div",{className:"warn"},e.message)); return; }
  if(tab!==t0) return;
  wrap.replaceChildren();
  const msg=el("div",{className:"warn"}); msg.textContent=flash; flash=""; wrap.append(msg);
  const act=async(fn,ok)=>{ try{ await fn(); flash=ok; renderOps(); }catch(e){ msg.textContent=e.message; } };
  if(t0==="review") viewReview(wrap,items,act);
  else if(t0==="plan") viewPlan(wrap,items,act);
  else viewStats(wrap,items,act,msg);
}
function viewReview(wrap,items,act){
  section(wrap,"承認待ち",items.filter(i=>i.state==="pending"||i.state==="needs-fix"),it=>{
    const cm=el("textarea",{placeholder:"コメント（修正指示・却下の理由。承認の時は空欄でOK）"}); cm.style.minHeight="48px";
    const ok=el("button",{className:"primary sm",textContent:"承認"}),fix=el("button",{className:"sm",textContent:"修正指示"}),ng=el("button",{className:"sm",textContent:"却下"});
    const c=()=>cm.value.trim();
    ok.onclick=()=>act(()=>setState(it.n,"approved","【承認】"+(c()?" "+c():"")),"承認しました");
    fix.onclick=()=>{ if(!c()){ alert("修正してほしい点を書いてください"); return; } act(()=>setState(it.n,"needs-fix","【修正指示】 "+c()),"修正指示を送りました"); };
    ng.onclick=()=>act(()=>setState(it.n,"rejected","【却下】"+(c()?" "+c():"")),"却下しました");
    const w=checkDraft(it.d.text||"");
    return [...(w.length?[el("div",{className:"warn"},w.join("\n"))]:[]),cm,el("div",{className:"inline",style:"margin-top:8px"},ok,fix,ng)];
  });
  section(wrap,"投稿待ち（承認済み）",items.filter(i=>i.state==="approved"),it=>{
    const when=el("input",{type:"datetime-local",value:it.d.sched||nowLocal()});
    const cp=el("button",{className:"sm",textContent:"本文をコピー"}),done=el("button",{className:"primary sm",textContent:"投稿した"}),undo=el("button",{className:"sm",textContent:"承認を取り消す"});
    cp.onclick=()=>copyText(it.d.text||"",cp);
    done.onclick=()=>act(async()=>{ await patchBody(it,{postedAt:when.value}); await setState(it.n,"posted","【投稿】"+when.value); },"投稿を記録しました");
    undo.onclick=()=>act(()=>setState(it.n,"pending","【承認取り消し】"),"承認待ちに戻しました");
    return [el("div",{className:"note"},"投稿した日時"),when,el("div",{className:"inline",style:"margin-top:8px"},cp,done,undo)];
  });
  section(wrap,"最近のもの（却下・投稿済み）",items.filter(i=>i.state==="rejected"||i.state==="posted").slice(0,5),()=>[]);
}
function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function viewPlan(wrap,items,act){
  const planned=items.filter(i=>["pending","approved","needs-fix","posted"].includes(i.state));
  const withS=planned.filter(i=>i.d.sched||i.d.postedAt).map(i=>Object.assign({},i,{when:new Date(i.d.postedAt||i.d.sched)})).sort((a,b)=>a.when-b.when);
  const groups={};
  withS.forEach(i=>{ const k=weekStart(i.when).getTime(); (groups[k]=groups[k]||[]).push(i); });
  const keys=Object.keys(groups).sort();
  if(!keys.length) wrap.append(el("div",{className:"note"},"予定のある下書きはまだありません"));
  keys.forEach(k=>{
    const g=groups[k], ws=new Date(+k), we=new Date(+k+6*86400000);
    const real=g.filter(i=>i.state==="approved"||i.state==="posted").length;
    const status=(real>=3&&real<=4)?"目標どおり":(real<3?"目標より少なめ（3〜4本）":"目標より多め（3〜4本）");
    wrap.append(el("h3",{},(ws.getMonth()+1)+"/"+ws.getDate()+"〜"+(we.getMonth()+1)+"/"+we.getDate()+"｜承認・投稿済み "+real+"本｜"+status));
    g.forEach(i=>wrap.append(el("div",{className:"item"},head(i),el("div",{className:"t"},(i.d.text||"").split("\n")[0]))));
  });
  section(wrap,"予定日が未設定",planned.filter(i=>!i.d.sched&&!i.d.postedAt&&i.state!=="posted"),it=>{
    const when=el("input",{type:"datetime-local"}); const sv=el("button",{className:"sm",textContent:"予定日を保存"});
    sv.onclick=()=>{ if(!when.value) return; act(()=>patchBody(it,{sched:when.value}),"予定日を保存しました"); };
    return [when,el("div",{className:"inline",style:"margin-top:8px"},sv)];
  });
}
async function viewStats(wrap,items,act,msg){
  const posted=items.filter(i=>i.state==="posted");
  if(!posted.length){ wrap.append(el("div",{className:"note"},"投稿済みの記録はまだありません。「承認」タブで「投稿した」を押すと、ここに出ます。")); return; }
  wrap.append(el("div",{className:"note"},"投稿から1〜2日後の数字を入れてください。見える範囲でOKです。"));
  const ids=["views","likes","replies","reposts","quotes"], labs=["閲覧","いいね","返信","再投稿","引用"];
  for(const it of posted){
    let comments=[]; try{ comments=await ghApi("/issues/"+it.n+"/comments?per_page=100"); }catch(e){}
    const mets=comments.map(c=>{ const b=c.body||""; if(!b.startsWith("【成績】")) return null; try{ return JSON.parse(b.slice(4)); }catch(e){ return null; } }).filter(Boolean);
    const last=mets[mets.length-1];
    const ins=ids.map((id,i)=>el("input",{type:"number",inputMode:"numeric",placeholder:labs[i]}));
    const sv=el("button",{className:"primary sm",textContent:"数字を記録"});
    sv.onclick=()=>{
      const m={at:new Date().toISOString()};
      ids.forEach((id,i)=>{ if(ins[i].value!=="") m[id]=Number(ins[i].value); });
      if(Object.keys(m).length<2){ msg.textContent="数字を1つ以上入れてください"; return; }
      act(()=>ghApi("/issues/"+it.n+"/comments",{method:"POST",body:{body:"【成績】"+JSON.stringify(m)}}),"記録しました");
    };
    const lastTxt=last?("最新："+labs.map((l,i)=>(ids[i] in last)?l+" "+last[ids[i]]:"").filter(Boolean).join("／")+"（"+fmtS(last.at)+"）"):"数字はまだありません";
    wrap.append(el("div",{className:"item"},head(it),el("div",{className:"t"},it.d.text||""),el("div",{className:"note"},lastTxt),el("div",{className:"nums"},...ins),el("div",{className:"inline",style:"margin-top:8px"},sv)));
  }
}

async function loadQuestions(){
  try{ const c=await caches.open("nagi-q"); const r=await c.match("./latest-questions.json"); return r?await r.json():null; }
  catch(e){ return null; }
}

function renderForm(){
  const list=$("#list"); list.replaceChildren();
  const wrap=el("div",{className:"form"});
  if(tab==="draft"){
    wrap.append(el("div",{className:"privacy"},"「承認待ちに送る」で、編集部の非公開メモ置き場に届き、「承認」タブで承認・却下・修正指示ができます。「この端末に保存」は端末の中だけ、「コピー」はチャットに貼る用です。"));
    const cat=el("select"); cat.append(...opts(CATS)); const fm=el("select"); fm.append(...opts(FORMS));
    const ta=el("textarea",{placeholder:"ここに投稿の下書きを書く"});
    const cnt=el("div",{className:"counter"}); const warn=el("div",{className:"warn"});
    const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+" / 500";cnt.className="counter"+(n>500?" over":"");warn.textContent=checkDraft(ta.value).join("\n")};
    ta.oninput=upd; upd();
    const save=el("button",{className:"primary",textContent:"この端末に保存"});
    const cp=el("button",{textContent:"チャット用にコピー"});
    const fmt=()=>"【下書き】\n区分: "+cat.value+"\n形式: "+fm.value+"\n本文:\n"+ta.value;
    save.onclick=()=>{if(!ta.value.trim())return;const a=LS.get("drafts");a.unshift({at:new Date().toISOString(),cat:cat.value,fm:fm.value,text:ta.value});LS.set("drafts",a);ta.value="";upd();renderForm()};
    cp.onclick=()=>copyText(fmt(),cp);
    const sched=el("input",{type:"datetime-local"});
    const dMsg=el("div",{className:"warn"}); dMsg.textContent=flash; flash="";
    const sendD=el("button",{className:"primary",textContent:"承認待ちに送る"});
    sendD.onclick=async()=>{
      if(!ta.value.trim()){dMsg.textContent="本文を書いてください";return;}
      sendD.disabled=true; dMsg.textContent="送信中…";
      try{
        await createDraft({cat:cat.value,fm:fm.value,text:ta.value,sched:sched.value});
        ta.value=""; flash="承認待ちに送りました。「承認」タブで確認できます"; renderForm();
      }catch(e){ dMsg.textContent=e.message; sendD.disabled=false; }
    };
    wrap.append(el("label",{},"区分"),cat,el("label",{},"形式"),fm,el("label",{},"本文"),ta,cnt,warn,el("label",{},"投稿予定日時（任意）"),sched,el("div",{className:"inline",style:"margin-top:12px"},sendD,save,cp),dMsg);
    const saved=el("div",{className:"saved"});
    LS.get("drafts").forEach((d,i)=>{
      const b1=el("button",{className:"sm",textContent:"コピー"}),b2=el("button",{className:"sm",textContent:"削除"});
      b1.onclick=()=>copyText("【下書き】\n区分: "+d.cat+"\n形式: "+d.fm+"\n本文:\n"+d.text,b1);
      b2.onclick=()=>{const a=LS.get("drafts");a.splice(i,1);LS.set("drafts",a);renderForm()};
      saved.append(el("div",{className:"item"},el("div",{className:"note"},new Date(d.at).toLocaleString("ja-JP")+"｜"+d.cat+"｜"+d.fm),el("div",{className:"t"},d.text),el("div",{className:"inline"},b1,b2)));
    });
    wrap.append(saved);
  } else {
    wrap.append(el("div",{className:"privacy"},"1分で書けるメモ。お子さんの名前・生年月日・顔・園名・居住地は書かないでください。「送信」を押すと、編集部の非公開メモ置き場に届きます（送信の設定が最初の1回だけ必要です）。「この端末に保存」は端末の中だけ、「コピー」はチャットに貼る用です。"));
    const topMsg=el("div",{className:"warn"}); topMsg.textContent=flash; flash=""; wrap.append(topMsg);
    const qbox=el("div",{className:"qbox"}); wrap.append(qbox);
    loadQuestions().then(d=>{
      if(!d||!d.questions||!d.questions.length){ qbox.append(el("div",{className:"note"},"今日の質問はまだありません。通知が届くと、ここに質問が出ます。")); return; }
      const ans=d.questions.map(()=>{ const a=el("textarea",{placeholder:"一言でOK（空欄はパス）"}); a.style.minHeight="56px"; return a; });
      const pubSel=el("select"); pubSel.append(...opts(["公開OK","ぼかして可","非公開"]));
      const qs=el("button",{className:"primary",textContent:"回答を送信"}); const qm=el("div",{className:"warn"});
      qs.onclick=async()=>{
        qs.disabled=true; qm.textContent="送信中…";
        try{
          const body="【体験メモ（質問への回答）】\n"+d.questions.map((q,i)=>"Q"+(i+1)+": "+q+"\nA"+(i+1)+": "+(ans[i].value.trim()||"パス")).join("\n")+"\n公開: "+pubSel.value;
          await sendIssue("【質問への回答】"+new Date().toLocaleDateString("ja-JP"),body);
          const c=await caches.open("nagi-q"); await c.delete("./latest-questions.json");
          flash="送信しました。ありがとうございます"; renderForm();
        }catch(e){ qm.textContent=e.message; qs.disabled=false; }
      };
      qbox.append(el("label",{},"今日の質問（"+new Date(d.at).toLocaleDateString("ja-JP")+"）"));
      d.questions.forEach((q,i)=>{ qbox.append(el("div",{className:"t"},(i+1)+". "+q),ans[i]); });
      qbox.append(el("label",{},"公開してよいか"),pubSel,el("div",{className:"inline",style:"margin-top:8px"},qs),qm,el("hr"));
    });
    const who=el("select"); who.append(...opts(["上の子","下の子","自分","家"]));
    const what=el("textarea",{placeholder:"何があった／感じた（一言でOK）"}); what.style.minHeight="90px";
    const item=el("input",{type:"text",placeholder:"商品（あれば）"});
    const res=el("select"); res.append(...opts(["良い","微妙","買わなかった","迷ってる","困っている","その他"]));
    const pubs=["公開OK","ぼかして可","非公開"]; let pub="公開OK";
    const pubRow=el("div",{className:"inline"});
    pubs.forEach(p=>{const r=el("input",{type:"radio",name:"pub",checked:p===pub});r.onchange=()=>pub=p;pubRow.append(el("label",{},r,p))});
    const fmt=()=>"【体験メモ】\n誰: "+who.value+"\n何があった: "+what.value+"\n商品: "+item.value+"\n結果: "+res.value+"\n公開: "+pub;
    const save=el("button",{className:"primary",textContent:"この端末に保存"}),cp=el("button",{textContent:"チャット用にコピー"});
    save.onclick=()=>{if(!what.value.trim())return;const a=LS.get("memos");a.unshift({at:new Date().toISOString(),text:fmt()});LS.set("memos",a);what.value="";item.value="";renderForm()};
    cp.onclick=()=>copyText(fmt(),cp);
    const send=el("button",{className:"primary",textContent:"送信（編集部へ）"}); const msg=el("div",{className:"warn"}); msg.textContent=flash; flash="";
    send.onclick=async()=>{
      if(!what.value.trim()){msg.textContent="「何があった」を一言書いてください";return;}
      send.disabled=true; msg.textContent="送信中…";
      try{
        const body=fmt();
        await sendIssue("【体験メモ】"+new Date().toLocaleDateString("ja-JP"),body);
        const a=LS.get("memos"); a.unshift({at:new Date().toISOString(),text:body+"\n（送信済み）"}); LS.set("memos",a);
        what.value=""; item.value=""; flash="送信しました。ありがとうございます"; renderForm();
      }catch(e){ msg.textContent=e.message; send.disabled=false; }
    };
    wrap.append(el("label",{},"誰のこと"),who,el("label",{},"何があった"),what,el("label",{},"商品（任意）"),item,el("label",{},"結果"),res,el("label",{},"公開してよいか"),pubRow,el("div",{className:"inline",style:"margin-top:12px"},send,save,cp),msg);
    const det=el("details",{style:"margin-top:16px"});
    const st=el("div",{className:"note"}); st.textContent=getTok()?"送信の設定：済み（この端末だけに保存）":"送信の設定：未設定";
    const tin=el("input",{type:"password",placeholder:"トークンを貼り付け",autocomplete:"off"});
    const ts=el("button",{className:"sm",textContent:"保存"}),tc=el("button",{className:"sm",textContent:"削除"});
    ts.onclick=()=>{ if(!tin.value.trim())return; try{localStorage.setItem(TOKEN_KEY,tin.value.trim())}catch(e){} renderForm(); };
    tc.onclick=()=>{ try{localStorage.removeItem(TOKEN_KEY)}catch(e){} renderForm(); };
    det.append(el("summary",{},"送信の設定（最初の1回だけ）"),el("div",{className:"note"},"トークンは、編集部の非公開メモ置き場にだけ書き込める鍵です。この端末のブラウザにだけ保存され、他の人に見せないでください。作り方はPCのClaudeに聞いてください。"),tin,el("div",{className:"inline",style:"margin-top:8px"},ts,tc),st);
    wrap.append(det);
    const saved=el("div",{className:"saved"});
    LS.get("memos").forEach((m,i)=>{
      const b1=el("button",{className:"sm",textContent:"コピー"}),b2=el("button",{className:"sm",textContent:"削除"});
      b1.onclick=()=>copyText(m.text,b1);
      b2.onclick=()=>{const a=LS.get("memos");a.splice(i,1);LS.set("memos",a);renderForm()};
      saved.append(el("div",{className:"item"},el("div",{className:"note"},new Date(m.at).toLocaleString("ja-JP")),el("div",{className:"t"},m.text),el("div",{className:"inline"},b1,b2)));
    });
    wrap.append(saved);
  }
  list.append(wrap);
}

function render(){
  const isOps=(tab==='review'||tab==='plan'||tab==='stats');
  const isForm=(tab==='draft'||tab==='memo'||isOps);
  document.querySelector('.clock').style.display=isForm?'none':'';
  $('#stats').style.display=isForm?'none':'';
  if(isOps){renderOps();return;}
  if(isForm){renderForm();return;}
  const now = nowDate();
  $("#now").textContent = fmt(now).replace(/\d+:\d+$/,"") + "（この日の終わり）";
  $("#slider").value = day;
  const shown = posts.filter(p => SHOWN.includes(p.status) && new Date(p.at) <= now);
  const stopped = posts.filter(p => !SHOWN.includes(p.status) && new Date(p.at) <= now);
  $("#stats").innerHTML =
    `<div class="stat"><b>${shown.length}</b>模擬投稿済み</div>`+
    `<div class="stat"><b>${stopped.length}</b>止まっている</div>`+
    `<div class="stat"><b>${posts.filter(p=>new Date(p.at)>now).length}</b>これから</div>`;
  const items = (tab==="timeline" ? shown : stopped).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  $("#list").innerHTML = items.length ? items.map(p=>`
    <article class="post">
      <div class="meta"><b style="color:var(--fg)">${ACCOUNTS[acct].name.split("｜")[0]}</b><span>${fmt(new Date(p.at))}</span>
        <span class="chip">${p.category}</span><span class="chip">${p.format}</span>
        <span class="s-${p.status}">● ${STATUS[p.status]}</span></div>
      <div class="text"></div>
      <div class="note">${p.id}｜体験・出典: ${p.exp}｜検査: ${p.lane}｜${p.note}</div>
    </article>`).join("") : `<div class="empty">${tab==="timeline"?"まだ投稿はありません":"止まっている投稿はありません"}</div>`;
  document.querySelectorAll(".post .text").forEach((el,i)=>{ el.textContent = items[i].text; });
}

$("#slider").oninput = e => { day = +e.target.value; render(); };
$("#next").onclick = () => {
  const now = nowDate();
  const nxt = posts.find(p => new Date(p.at) > now && SHOWN.includes(p.status));
  if(!nxt) return;
  day = Math.floor((new Date(nxt.at.slice(0,10)+"T00:00") - START)/86400000); render();
};
$("#reset").onclick = () => { day = 0; stop(); render(); };
function stop(){ clearInterval(timer); timer = null; $("#auto").textContent = "自動再生"; }
$("#auto").onclick = () => {
  if(timer) return stop();
  $("#auto").textContent = "停止";
  timer = setInterval(()=>{ if(day>=13) return stop(); day++; render(); }, 1200);
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
  tab = t.dataset.tab; render();
});

function setAccount(id){
  stop(); acct=id; day=0; tab="timeline"; location.hash=id;
  try{localStorage.setItem("acct",id)}catch(e){}
  const a=ACCOUNTS[id]; START=new Date(a.start);
  $("#avatar").textContent=a.avatar; $("#pname").textContent=a.name;
  $("#phandle").textContent=a.handle; $("#pbio").textContent=a.bio;
  document.title="仮想SNS 模擬運用｜"+a.label;
  document.querySelectorAll("#switch button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  ["memo","review","plan","stats"].forEach(t=>{ document.querySelector('.tab[data-tab="'+t+'"]').style.display=a.memo?"":"none"; });
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab==="timeline"));
  posts=[]; render();
  fetch(a.file+"?t="+Date.now()).then(r=>r.json()).then(d=>{ if(acct===id){ posts=d; render(); } })
    .catch(()=>{ $("#list").innerHTML = '<div class="empty">'+a.file+' を読み込めません。ローカルサーバー経由で開いてください</div>'; });
}
Object.entries(ACCOUNTS).forEach(([id,a])=>{
  const b=el("button",{textContent:a.label}); b.dataset.id=id; b.onclick=()=>setAccount(id); $("#switch").append(b);
});
setAccount(acct);
if(new URLSearchParams(location.search).get("tab")==="memo"){
  tab="memo";
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab==="memo"));
  render();
}
</script>
