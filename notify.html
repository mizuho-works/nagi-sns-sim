<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>通知の設定｜なぎ編集部メモ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e0607e">
<style>
:root{--bg:#fff;--fg:#101010;--sub:#777;--line:#e6e6e6;--card:#f7f7f7;--accent:#e0607e}
@media (prefers-color-scheme:dark){:root{--bg:#101010;--fg:#f3f3f3;--sub:#9a9a9a;--line:#2a2a2a;--card:#1b1b1b}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,"Hiragino Sans",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px}
.step{background:var(--card);border-radius:14px;padding:14px;margin:14px 0}
.step b{display:block;margin-bottom:6px}
button{font:inherit;border:0;background:var(--accent);color:#fff;padding:12px 16px;border-radius:12px;width:100%;margin-top:8px}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
textarea{width:100%;min-height:150px;font:12px/1.4 monospace;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
#status{margin-top:10px;white-space:pre-wrap;font-size:14px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>通知の設定</h1>
  <div class="sub">体験メモの質問を、水・日の9:30にスマホへ届けます。</div>

  <div class="step"><b>① ホーム画面に追加（iPhoneのみ必要）</b>
    Safariでこのページを開き、共有ボタン →「ホーム画面に追加」。追加したアイコンから開き直してください。<br>
    <span class="sub">いまの状態：<span id="mode">確認中…</span></span>
  </div>

  <div class="step"><b>② 通知を許可して登録</b>
    <button id="reg">通知を許可して登録する</button>
    <button class="alt" id="test">この端末に通知を1つ表示してみる</button>
  </div>

  <div class="step"><b>③ 表示された文字列を送る</b>
    下の文字列は、この端末に通知を送るための宛先です（パスワードではありません）。コピーして、PCのClaudeのチャットに貼り付けてください。
    <textarea id="sub" readonly placeholder="登録するとここに表示されます"></textarea>
    <button class="alt" id="copy">コピー</button>
  </div>
  <div id="status"></div>
</div>
<script>
const PUBLIC_KEY = "BGk4tBnEatGQkA3Yf9bxFFl7qDy4eI2CdNeniFEu_6alFvMjvOnmZkDsMFo4rWN8DCLZGZvkn5uDQTZUHmn52nE";
const $ = s => document.querySelector(s);
const say = t => { $("#status").textContent = t; };
function b64(s){ const p="=".repeat((4-s.length%4)%4); const r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); }

const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
$("#mode").textContent = standalone ? "ホーム画面のアプリとして開いています（OK）" : (ios ? "ブラウザで開いています（①が必要）" : "ブラウザで開いています");

async function swReg(){
  if(!("serviceWorker" in navigator)) throw new Error("この環境は通知に対応していません");
  return navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready);
}

$("#reg").onclick = async () => {
  try{
    if(ios && !standalone){ say("先に①でホーム画面に追加し、そのアイコンから開き直してください。"); return; }
    if(!("PushManager" in window)){ say("この環境はプッシュ通知に対応していません。"); return; }
    const reg = await swReg();
    const perm = await Notification.requestPermission();
    if(perm !== "granted"){ say("通知が許可されませんでした。設定アプリ →「なぎメモ」→ 通知 をオンにしてください。"); return; }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64(PUBLIC_KEY) });
    $("#sub").value = JSON.stringify(sub);
    say("登録できました。下の文字列をコピーして、PCのClaudeに貼り付けてください。");
  }catch(e){ say("エラー: " + e.message); }
};

$("#test").onclick = async () => {
  try{
    const reg = await swReg();
    if((await Notification.requestPermission()) !== "granted"){ say("通知が許可されていません。"); return; }
    await reg.showNotification("なぎ編集部｜テスト", { body:"この通知が見えれば、表示はOKです", icon:"icon-192.png", data:{ url:"./?tab=memo" } });
    say("通知を表示しました（画面の上に出ます）。");
  }catch(e){ say("エラー: " + e.message); }
};

$("#copy").onclick = async () => {
  const t = $("#sub").value;
  if(!t){ say("先に②で登録してください。"); return; }
  try{ await navigator.clipboard.writeText(t); say("コピーしました。"); }
  catch(e){ $("#sub").select(); say("文字列を長押ししてコピーしてください。"); }
};
</script>
</body>
</html>
